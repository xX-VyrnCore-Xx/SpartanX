name: Bug report
description: Something in SpartanX doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please search existing issues first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Dock settings
        2. Set position to Left
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Dynamic Island, Dock, Menu bar, Welcome / Setup, Settings, Updates, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SpartanX version
      description: Settings → About
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver`
      placeholder: Windows 11 24H2 (26100.xxxx), x64
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: error.log
      description: If present, paste the end of `%LOCALAPPDATA%\SpartanX\error.log`.
      render: text
