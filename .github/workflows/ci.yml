name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test tests/SpartanX.Core.Tests -c Release --logger "console;verbosity=normal"

  build-app:
    name: App (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build src/SpartanX.App/SpartanX.App.csproj -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }}
      - name: Test (Windows)
        if: matrix.platform == 'x64'
        run: dotnet test tests/SpartanX.Core.Tests -c Release
      # Validate the installer script on every PR, not only at release time.
      - name: Installer (x64)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          dotnet publish src/SpartanX.App/SpartanX.App.csproj -c Release -p:Platform=x64 -r win-x64 -o out/win-x64
          ./build/installer/build.ps1 -Version '0.0.0-ci' -Arch x64 -SourceDir out/win-x64

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test
        run: swift test --package-path macos
      - name: Build DMG
        run: ./macos/scripts/build-dmg.sh 0.0.0-ci
