version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Windows App SDK 2.x is a major upgrade that needs a deliberate migration.
      - dependency-name: Microsoft.WindowsAppSDK
        update-types: ["version-update:semver-major"]
    groups:
      windows-app-sdk:
        patterns: ["Microsoft.WindowsAppSDK", "Microsoft.Windows.SDK.BuildTools"]
      tests:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
