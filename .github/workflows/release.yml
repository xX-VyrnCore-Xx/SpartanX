name: Release

# Publish by either:
#  - pushing a tag like v0.1.0 (or v0.2.0-beta.1 for a pre-release), or
#  - running this workflow manually on a branch with a new tag name: the release
#    (and its tag) is created at the commit the workflow ran on.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.1.0 (created at the selected branch head if missing)'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          # Manual runs build the exact commit they were started on.
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag || github.ref_name }}'
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Test
        if: matrix.platform == 'x64'
        run: dotnet test tests/SpartanX.Core.Tests -c Release

      - name: Publish
        run: >
          dotnet publish src/SpartanX.App/SpartanX.App.csproj
          -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.version }}
          -o out/${{ matrix.rid }}

      - name: Zip
        shell: pwsh
        run: |
          $name = "SpartanX-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path out/${{ matrix.rid }}/* -DestinationPath $name
          (Get-FileHash $name -Algorithm SHA256).Hash.ToLower() + "  $name" | Out-File "$name.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: SpartanX-*.zip*

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
